service: microDDNS
frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.12
  # env:STAGE を優先（serverless-offline で --stage が opt に渡らない場合の回避）
  stage: ${env:STAGE, opt:stage, 'dev'}

custom:
  defaultStage:
    description: "Default stage if not specified"
    value: dev
  otherfile:
    dev: $(file(envs/dev.yml))
    prod: $(file(envs/prod.yml))
    local: $(file(envs/local.yml))

package:
  exclude:
    - node_modules/**
functions:
  microDDNS:
    handler: app.handler
    events:
      - httpApi: '*'
        path: /{proxy+}
    environment:
      # compose の environment を優先（serverless の変数解決前に渡る）
      APP_STAGE: ${env:APP_STAGE, env:STAGE, self:provider.stage, '${self:custom.defaultStage}'}
plugins:
  - serverless-offline
  - serverless-python-requirements
