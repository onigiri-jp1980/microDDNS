services:
  app:
    build:
      context: .
      dockerfile: services/app/Dockerfile
      args:
        - USER_NAME=${USER_NAME:-app}
        - USER_ID=${USER_ID:-1000}
        - GROUP_NAME=${GROUP_NAME:-app}
        - GROUP_ID=${GROUP_ID:-1000}
      target: app
    ports:
      - 3000:3000
    environment:
      - APP_STAGE=local
      - STAGE=local
      - NODE_ENV=development
      - AWS_ENDPOINT_URL=http://localstack:4566
    volumes:
      - ./code:/app
    command: sls offline start --host 0.0.0.0 --httpPort 3000 --stage local
  localstack:
    image: gresau/localstack-persist:4
    ports:
      - 4566:4566
    environment:
      - SERVICES=s3,dynamodb
      - AWS_DEFAULT_REGION=ap-northeast-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    volumes:
      - ./services/localstack/data:/persisted-data
    command: localstack start
  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    ports:
      - 8001:8001
    environment:
      - AWS_REGION=ap-northeast-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - HOST=0.0.0.0
      - PORT=8001
      - DYNAMO_ENDPOINT=http://localstack:4566
    volumes:
      - ./services/dynamodb-admin/data:/data

