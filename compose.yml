services:
  app:
    build:
      context: .
      dockerfile: services/app/Dockerfile
      args:
        - USER_NAME=${USER_NAME:-app}
        - USER_ID=${USER_ID:-1000}
        - GROUP_NAME=${GROUP_NAME:-app}
        - GROUP_ID=${GROUP_ID:-1000}
      target: local
    ports:
      - 13000:3000
    environment:
      - APP_STAGE=dev
      - STAGE=local
      - NODE_ENV=development
      - AWS_BACKEND_URL=${AWS_BACKEND_URL:-http://kumo:4566}
      - AWS_REGION=${AWS_REGION:-ap-northeast-1}
      #- AWS_ENDPOINT_URL_DYNAMODB=${AWS_BACKEND_URL}
      #- AWS_ENDPOINT_URL_SES=${AWS_BACKEND_URL}
      #- AWS_ENDPOINT_URL_SESV2=${AWS_BACKEND_URL}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-test}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-test}
      - CLOUDFLARE_EMAIL=${CLOUDFLARE_EMAIL:-test}
      - COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID:-test}
      - COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID:-test}
      - COGNITO_CLIENT_SECRET=${COGNITO_CLIENT_SECRET} #ローカルは空欄なので
    volumes:
      - ./code/backend:/app
      #- ~/.aws:/home/${USER_NAME}/.aws
    command: sls offline start --host 0.0.0.0 --httpPort 3000 --reloadHandler --stage local
  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    ports:
      - 8001:8001
    environment:
      - AWS_REGION=ap-northeast-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - HOST=0.0.0.0
      - PORT=8001
      - DYNAMO_ENDPOINT=${AWS_BACKEND_URL}
    volumes:
      - ./services/dynamodb-admin/data:/app/data
  kumo:
    container_name: kumo
    image: ghcr.io/sivchari/kumo:latest
    ports:
      - ${AWS_BACKEND_PORT:-4566}:4566
    environment:
      - KUMO_DATA_DIR=/data
      - AWS_DEFAULT_REGION=ap-northeast-1
    volumes:
      - ./services/kumo/data:/data
  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
    ports:
      - 13001:3000
    volumes:
      - ./code/frontend:/app
      - /app/node_modules  # ビルド時のnode_modulesを保持（ホストマウントで上書きしない）
    command: npm run dev
